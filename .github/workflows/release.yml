name: Compilar y Publicar Electron

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Compilar Windows
    runs-on: windows-latest

    # Detiene la cancelación en cadena si una máquina falla
    # Incrementa el tiempo límite de ejecución a 30 minutos por máquina
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar (typecheck + bundle)
        run: pnpm test && pnpm typecheck && pnpm exec vite build

      - name: Empaquetar y publicar
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
