name: Publicar cargador de música

# A tag alone must never publish a partial Windows-only release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag already created on the current main commit (for example v1.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar versión y commit revisado
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse "refs/tags/$TAG" >/dev/null
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          test "$TAG" = "v$(node -p "require('./package.json').version")"

  windows:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Exigir firma Windows
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw 'Faltan los secretos de firma Windows'
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec vite build
      - name: Compilar Windows sin publicar
        run: pnpm exec electron-builder --win --x64 --publish never
      - name: Verificar firma de ejecutables
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path release -File -Filter *.exe)
          if ($executables.Count -lt 2) { throw 'Faltan ejecutables Windows' }
          foreach ($file in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Firma inválida: $($file.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: music-uploader-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  macos:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Exigir firma y notarización
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Falta el secreto $name"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec vite build
      - name: Firmar y notarizar macOS x64 y arm64 sin publicar
        run: pnpm exec electron-builder --mac --x64 --arm64 --publish never
      - name: Verificar firma, Gatekeeper y ticket
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose --type exec "$app"
            xcrun stapler validate "$app"
            count=$((count + 1))
          done < <(find release -mindepth 2 -maxdepth 2 -type d -name '*.app' -print0)
          test "$count" -ge 2
          find release -maxdepth 1 -name '*-mac-x64.dmg' | grep -q .
          find release -maxdepth 1 -name '*-mac-arm64.dmg' | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: music-uploader-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: music-uploader-*
          path: release-ready
          merge-multiple: true
      - name: Publicar solo si ambas plataformas aprobaron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-ready/*)
          test "${#files[@]}" -gt 0
          gh release create "$TAG" "${files[@]}" --verify-tag \
            --title "ClubF5 Cargador OBS ${TAG#v}" \
            --notes "Cargador de música con acceso de operador y cargas reanudables. Windows y macOS."
