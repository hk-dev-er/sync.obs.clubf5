name: Verificar cargador

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec vite build
      - name: Crear instalador y versión portable Windows sin publicar
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Comprobar ambos ejecutables
        shell: pwsh
        run: |
          if (@(Get-ChildItem -Path release -File -Filter *.exe).Count -lt 2) {
            throw 'Faltan el instalador o la versión portable Windows'
          }

  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec vite build
      - name: Crear DMG Intel y Apple Silicon sin publicar
        run: |
          pnpm exec electron-builder --mac --x64 --arm64 --publish never -c.mac.notarize=false
          find release -maxdepth 1 -name '*-mac-x64.dmg' | grep -q .
          find release -maxdepth 1 -name '*-mac-arm64.dmg' | grep -q .
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
